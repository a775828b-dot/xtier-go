name: check

# No model and no phone: unit tests on x86-64 and on aarch64 (QEMU, the NEON kernels), the Android build of the
# engine (command-line tools for adb shell) and of the app. Artifacts: the debug APK and the arm64 tools.
on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: ninja -C build
      - run: build/kernels_test && build/parsers_test
      - run: python3 tests/card_check.py
      - run: python3 -m py_compile reference/*.py tests/*.py tools/*.py

  arm64-qemu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build g++-aarch64-linux-gnu qemu-user
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ -DXTG_TOOLS=OFF
      - run: ninja -C build kernels_test parsers_test
      - run: |
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/kernels_test
          qemu-aarch64 -L /usr/aarch64-linux-gnu build/parsers_test

  android-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static
      - run: ninja -C build
      - uses: actions/upload-artifact@v4
        with:
          name: xtg-android-arm64-tools
          path: |
            build/xtg-server
            build/xtg-cli
            build/kernels_test
            build/parsers_test

  android-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p app assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: xtier-go-debug-apk
          path: app/app/build/outputs/apk/debug/*.apk
